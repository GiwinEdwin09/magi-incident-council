  - when: {}
    output:
      evidence_id: '{{target}}'
      source_reliability: 0.9
      plausibility: 0.85
      corroborating_ids: []
      contradicting_ids: []
      credibility: 0.85
      verdict: ACCEPT
      reason: Consistent with my evidence.
CASPER:
  PROPOSE:
  - when:
      dp: DP1
    output:
      assessment: 18,400 EU merchants are failing payments at 27 writes per second (E-7). Personal and card data may be involved, so the GDPR 72-hour clock may start (E-8). Customers need honest communication
        now.
      key_claims:
      - text: Every second of lag is about 27 payment writes at risk on failover.
        evidence_ids:
        - E-7
        confidence: 0.85
      - text: A personal-data breach would start a 72-hour GDPR notification clock.
        evidence_ids:
        - E-8
        confidence: 0.9
      proposal:
        title: 'Protect customers: status update, breach assessment, shed 20%'
        actions:
        - action_id: status_page.publish
          params:
          - name: severity
            value: degraded
          - name: message
            value: Payments degraded in the EU; we are investigating.
        - action_id: legal.open_breach_assessment
          params:
          - name: incident
            value: current
        - action_id: traffic.shed
          params:
          - name: service
            value: payments-api
          - name: percent
            value: '20'
        rationale: Honest communication, starts the legal process without notifying anyone externally, and reduces failed payments.
        expected_outcome: Fewer failed payments and fewer support tickets while containment is decided.
        risks:
        - Does not address the cause.
      confidence: 0.75
      insufficient_info: false
      info_needed: []
      tool_requests:
      - tool: get_customer_impact
        params:
        - name: service
          value: payments-api
        reason: How many writes a failover would discard.
  - when:
      dp: DP2
    output:
      assessment: Lag is still about 40s, so failing over now discards roughly 1,000 payment writes. CUS-2 forbids that without IC approval. Waiting for catch-up avoids any loss.
      key_claims:
      - text: A failover now discards roughly 1,000 payment writes.
        evidence_ids:
        - E-7
        confidence: 0.8
      proposal:
        title: Fail over only when lag is under 5s, then isolate db-7
        actions:
        - action_id: db.failover
          params:
          - name: cluster
            value: pay-db
          - name: when
            value: lag<5s
        - action_id: host.isolate_network
          params:
          - name: host
            value: db-7
          - name: after
            value: failover
        rationale: Zero write loss and the host is still isolated, just later.
        expected_outcome: No discarded payments; db-7 isolated after catch-up.
        risks:
        - Payments stay degraded until catch-up (about 20 minutes).
      confidence: 0.75
      insufficient_info: false
      info_needed: []
      tool_requests: []
  SCORE:
  - when:
      dp: DP1
    output:
      scores:
      - proposal_ref: P-1@1
        score: 3
        reason: Fast, but ignores possible customer-data exposure.
      - proposal_ref: P-2@1
        score: 3
        reason: Failover now discards customer payments.
      - proposal_ref: P-3@1
        score: 8
        reason: Protects customers without irreversible steps.
      ranking:
      - P-3@1
      - P-2@1
      - P-1@1
  - when:
      dp: DP2
    output:
      scores:
      - proposal_ref: P-4@1
        score: 6
        reason: No write loss, but the breach may widen.
      - proposal_ref: P-5@1
        score: 2
        reason: Discards about 1,000 payments.
      - proposal_ref: P-6@1
        score: 9
