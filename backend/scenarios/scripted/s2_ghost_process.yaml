      ranking:
      - P-6@1
      - P-4@1
      - P-5@1
  CRITIQUE:
  - when:
      dp: DP1
    output:
      objections:
      - proposal_ref: '{{latest:P-2}}'
        text: Failover at 45s lag discards about 1,200 EU payment writes (C-5, {{tool:get_customer_impact}}).
        severity: blocking
        cites_policy: CUS-2
