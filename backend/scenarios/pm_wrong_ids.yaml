id: pm_wrong_ids
title: "Cleanup script deleted hundreds of customer sites"
company: "Tessellate Software"
kind: postmortem
based_on: { name: "Atlassian outage, April 2022 (post-incident review)", url: "https://www.atlassian.com/engineering/post-incident-review-april-2022-outage" }
summary: "A maintenance script was given the wrong kind of ID and deleted whole customer sites. Restores will take days; the customers do not know yet."
services: [cloud-sites]
speed: 6
end_after_s: 600

world:
  services:
    cloud-sites: { region: global, latency_p99_ms: 300, error_rate: 0.002, version: "2022.4", slo_p99_ms: 800 }
  assets:
    cleanup-job: { role: batch, serving: false, suspicious: false }
  clusters: {}
  flags: { deleted_sites: 400, status_page: operational }

dynamics: []
effects: {}

source_reliability: { metrics: 0.95, deploys: 0.98, logs: 0.9, customers: 0.9, tool: 0.95 }

policies:
  MELCHIOR: { REL-3: "Restores run in the order that minimizes total customer downtime." }
  BALTHASAR: { DATA-3: "Restores must not overwrite data of customers who were not affected." }
  CASPER: { CUS-4: "Affected customers must be contacted directly within 2 hours of a confirmed data-loss incident, with a timeline." }

timeline:
  - { t: 0, id: E-1, source: logs, visible_to: [MELCHIOR, BALTHASAR, CASPER],
      content: "A cleanup script meant to remove a retired app's data ran with a list of whole-site IDs instead of app IDs. ~400 customer sites were deleted between 07:38 and 08:01 UTC." }
  - { t: 0, id: E-2, source: deploys, visible_to: [MELCHIOR],
      content: "Backups exist for every deleted site, but restoring a site is a multi-step manual process (~a few sites per engineer-hour today). Automation for bulk restore does not exist yet." }
  - { t: 0, id: E-3, source: siem, visible_to: [BALTHASAR],
      content: "Not an attack. Backups for deleted sites verified restorable from the last 5 minutes before deletion. Unaffected sites share the same storage clusters." }
  - { t: 0, id: E-4, source: customers, visible_to: [CASPER],
      content: "Affected customers can't open support tickets normally: their admin contact details lived in the deleted sites. Several are already posting publicly that their tools vanished. No direct message has gone out yet (4 hours since deletion)." }

injections: []

feeds:
  get_metrics: { default: "cloud-sites healthy for unaffected customers. Deleted sites: {flags.deleted_sites}." }
  get_recent_deploys: { default: "Cleanup script executed 07:38-08:01 UTC with site IDs instead of app IDs." }
  get_runbook: { default: "Site restore: multi-step, per site. Prioritize by customer impact; build bulk automation in parallel." }
  get_dependencies: { default: "Each restored site needs its identity, app links, and permissions re-wired." }
  query_siem: { default: "No security event. Script ran with valid credentials." }
  check_ip_allowlist: { default: "Not relevant." }
  get_process_list: { default: "cleanup-job: stopped." }
  get_replication_state: { default: "Backups verified for all deleted sites (point-in-time, 5 minutes before deletion). Restores into a separate environment avoid touching unaffected data." }
  get_customer_impact: { default: "{flags.deleted_sites} customer sites gone (tens of thousands of users). Customers learning about it from colleagues and social media." }
  get_contracts: { default: "Enterprise customers: contractual incident notification within 24 hours; 99.9% availability." }
  get_regulatory_obligations: { default: "No personal-data breach (data deleted, not exposed); contractual notification duties apply." }
  get_status_page: { default: "Status page: {flags.status_page} (does not mention the deletions)." }

decision_points:
  - { id: DP1, at: 20, title: "Deleted customer sites", question: "About 400 customer sites were deleted by a faulty script. Restores will be slow and the affected customers have not heard from us. What should the council do?" }

labels:
  DP1:
    best: [["customers.notify", "data.restore"]]
    acceptable_actions: [customers.notify, data.restore, status_page.publish, comms.alternate_channel, comms.slack_update, deploy.halt_pipeline, investigate.verify]
    harmful_actions: [hold, "data.restore(scope=all)"]
    should_escalate: false
    rationale: "The post-incident review names slow, indirect communication as a major failure: customers learned from others before hearing from the company. CASPER-led: contact affected customers directly with a timeline while restores run in priority order; restore only affected sites."
