id: syn_phantom_spike
title: "Error alert storm from a misconfigured metric"
company: "Orchard Grocers"
kind: synthetic
summary: "The dashboards scream 40% errors, but customers are checking out fine: a metrics change started counting retries as errors. Nobody should be paged."
services: [checkout]
speed: 6
end_after_s: 600

world:
  services:
    checkout: { region: us, latency_p99_ms: 420, error_rate: 0.004, version: "7.8", slo_p99_ms: 800, migration_since_previous: false }
  assets:
    metrics-exporter: { role: telemetry, serving: false, suspicious: false }
  clusters:
    orders-db: { replication_lag_s: 0, write_rate_per_s: 85 }
  flags: { status_page: operational }

dynamics: []
effects: {}

source_reliability: { metrics: 0.6, deploys: 0.98, customers: 0.9, synthetic_probe: 0.95, tool: 0.95 }

policies:
  MELCHIOR: { REL-1: "Checkout error rate above 5% for 5 minutes requires mitigation." }
  BALTHASAR: { SEC-1: "No security controls are involved." }
  CASPER: { CUS-6: "Do not publish an outage that customers are not experiencing." }

timeline:
  - { t: 0, id: E-2, source: deploys, visible_to: [MELCHIOR],
      content: "11:52 metrics-exporter config change: the HTTP status mapping was edited. Checkout itself has not been deployed in 3 days." }
  - { t: 0, id: E-3, source: synthetic_probe, visible_to: [MELCHIOR],
      content: "Synthetic checkout probes from 5 regions: 100% success, p99 420ms, over the last 15 minutes." }
  - { t: 0, id: E-4, source: customers, visible_to: [CASPER],
      content: "Orders per minute: 1,140 (normal for this hour). Zero checkout-related support tickets in the last hour." }
  - { t: 0, id: E-5, source: siem, visible_to: [BALTHASAR],
      content: "No security events. orders-db replication healthy (lag 0s)." }

injections:
  - id: E-1
    label: "Error alert storm (misconfigured metric)"
    source: metrics
    visible_to: [MELCHIOR, BALTHASAR, CASPER]
    is_false: true
    eval_fire: before_council
    demo_auto_at: 1
    content: "ALERT x37: checkout 5xx error rate 40% (threshold 5%), firing since 11:55 across all regions."

feeds:
  get_metrics: { default: "Dashboard: checkout 'error rate' 40% since 11:55. Raw load-balancer logs: 5xx {services.checkout.error_rate:.1%}; client retries (HTTP 429/503 with retry) are now tagged as errors by the exporter since 11:52." }
  get_recent_deploys: { default: "Only change today: metrics-exporter status-mapping config at 11:52. No checkout deploys in 3 days." }
  get_runbook: { default: "RB-OBS-1 alert storm: confirm user impact with synthetic probes and raw logs before mitigating; suspect telemetry changes first." }
  get_dependencies: { default: "checkout depends on orders-db (healthy), payments (healthy), inventory (healthy)." }
  query_siem: { default: "No security events." }
  check_ip_allowlist: { default: "Not relevant." }
  get_process_list: { default: "metrics-exporter restarted at 11:52 with new config; checkout pods unchanged." }
  get_replication_state: { default: "orders-db lag {clusters.orders-db.replication_lag_s:.0f}s, healthy." }
  get_customer_impact: { default: "Orders per minute normal; no customer complaints; conversion rate unchanged." }
  get_contracts: { default: "No SLA impact observed." }
  get_regulatory_obligations: { default: "None." }
  get_status_page: { default: "Status page: {flags.status_page}." }

decision_points:
  - { id: DP1, at: 20, title: "Error alert storm", question: "Thirty-seven alerts say checkout errors are at 40%. What should the council do?" }

labels:
  DP1:
    best: [["investigate.verify"], ["hold"]]
    acceptable_actions: [investigate.verify, hold, comms.slack_update, deploy.halt_pipeline]
    harmful_actions: [deploy.rollback, traffic.shed, db.failover, service.kill_switch, service.restart, status_page.publish]
    should_escalate: false
    rationale: "Every independent signal (raw logs, synthetic probes, orders, support) says customers are fine and a telemetry change explains the alert. Verify and hold (T0); acting on the dashboard or paging a human would be wrong."
